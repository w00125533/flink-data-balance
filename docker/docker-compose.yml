name: fdb

services:
  observability-api:
    image: eclipse-temurin:17-jre
    container_name: fdb-observability-api
    working_dir: /app
    command: ["java", "-jar", "/app/observability-api.jar"]
    environment:
      FDB_OBSERVABILITY_PORT: "18080"
      FDB_KAFKA_BOOTSTRAP: ${FDB_KAFKA_BOOTSTRAP:-kafka:9092}
      FDB_METRICS_TOPIC: fdb-stage-metrics
      FDB_RUN_HISTORY_DIR: /observability-runs
      FDB_STARROCKS_JDBC_URL: ${FDB_STARROCKS_JDBC_URL:-jdbc:mysql://starrocks-fe:9030/fdb?rewriteBatchedStatements=true&useServerPrepStmts=false}
      FDB_STARROCKS_USER: ${FDB_STARROCKS_USER:-root}
      FDB_STARROCKS_PASSWORD: ${FDB_STARROCKS_PASSWORD:-}
      FDB_STARROCKS_DATABASE: ${FDB_STARROCKS_DATABASE:-fdb}
      FDB_DYNAMIC_BALANCING_ENABLED: ${FDB_DYNAMIC_BALANCING_ENABLED:-false}
      FDB_FLINK_PARALLELISM: ${FDB_FLINK_PARALLELISM:-4}
      FDB_RESULT_SINK: ${FDB_RESULT_SINK:-starrocks}
      FDB_DLQ_ENABLED: ${FDB_DLQ_ENABLED:-true}
      FDB_METRICS_ENABLED: ${FDB_METRICS_ENABLED:-true}
      FDB_METRICS_HISTORY_ENABLED: ${FDB_METRICS_HISTORY_ENABLED:-true}
      FDB_METRICS_EMIT_INTERVAL_MS: ${FDB_METRICS_EMIT_INTERVAL_MS:-5000}
      FDB_RUN_ID: "${FDB_RUN_ID:-}"
      FDB_RUN_LABEL: "${FDB_RUN_LABEL:-}"
      FDB_FLINK_CHECKPOINT_INTERVAL_MS: ${FDB_FLINK_CHECKPOINT_INTERVAL_MS:-30000}
    ports:
      - "18080:18080"
    volumes:
      - ../observability-api/target/observability-api-0.1.0-SNAPSHOT.jar:/app/observability-api.jar:ro
      - ./data/observability-runs:/observability-runs
    networks:
      - default
      - shared-data-infra

  frontend:
    image: node:20-alpine
    container_name: fdb-observability-frontend
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev"]
    environment:
      VITE_API_PROXY_TARGET: "http://observability-api:18080"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
    depends_on:
      - observability-api

  jobmanager:
    image: flink:1.20.3-scala_2.12-java17
    container_name: fdb-flink-jobmanager
    profiles: ["e2e"]
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - "FLINK_PROPERTIES=jobmanager.memory.process.size: ${FDB_FLINK_JOBMANAGER_MEMORY:-1600m}\nmetrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory\nmetrics.reporter.prom.port: 9249\nstate.checkpoints.num-retained: ${FDB_FLINK_RETAINED_CHECKPOINTS:-2}\nheartbeat.timeout: ${FDB_FLINK_HEARTBEAT_TIMEOUT_MS:-50000}\nheartbeat.interval: ${FDB_FLINK_HEARTBEAT_INTERVAL_MS:-10000}\npekko.ask.timeout: ${FDB_FLINK_PEKKO_ASK_TIMEOUT:-60s}"
      - FDB_KAFKA_BOOTSTRAP=${FDB_KAFKA_BOOTSTRAP:-kafka:9092}
      - FDB_KAFKA_FETCH_MAX_BYTES=${FDB_KAFKA_FETCH_MAX_BYTES:-}
      - FDB_KAFKA_MAX_PARTITION_FETCH_BYTES=${FDB_KAFKA_MAX_PARTITION_FETCH_BYTES:-}
      - FDB_KAFKA_MAX_POLL_RECORDS=${FDB_KAFKA_MAX_POLL_RECORDS:-}
      - FDB_STARROCKS_FE_ENDPOINT=${FDB_STARROCKS_FE_ENDPOINT:-starrocks-fe:9030}
      - FDB_STARROCKS_JDBC_URL=${FDB_STARROCKS_JDBC_URL:-jdbc:mysql://starrocks-fe:9030/fdb?rewriteBatchedStatements=true&useServerPrepStmts=false}
      - FDB_STARROCKS_CONNECTOR_JDBC_URL=${FDB_STARROCKS_CONNECTOR_JDBC_URL:-jdbc:mysql://starrocks-fe:9030}
      - FDB_STARROCKS_LOAD_URL=${FDB_STARROCKS_LOAD_URL:-starrocks-fe:8030}
      - FDB_STARROCKS_USER=${FDB_STARROCKS_USER:-root}
      - FDB_STARROCKS_PASSWORD=${FDB_STARROCKS_PASSWORD:-}
      - FDB_STARROCKS_DATABASE=${FDB_STARROCKS_DATABASE:-fdb}
      - FDB_STARROCKS_SINK_SEMANTIC=${FDB_STARROCKS_SINK_SEMANTIC:-exactly-once}
      - FDB_STARROCKS_SINK_LABEL_PREFIX=${FDB_STARROCKS_SINK_LABEL_PREFIX:-}
      - FDB_STARROCKS_SINK_BUFFER_FLUSH_MAX_BYTES=${FDB_STARROCKS_SINK_BUFFER_FLUSH_MAX_BYTES:-}
      - FDB_STARROCKS_SINK_BUFFER_FLUSH_MAX_ROWS=${FDB_STARROCKS_SINK_BUFFER_FLUSH_MAX_ROWS:-}
      - FDB_STARROCKS_SINK_BUFFER_FLUSH_INTERVAL_MS=${FDB_STARROCKS_SINK_BUFFER_FLUSH_INTERVAL_MS:-}
      - FDB_HIVE_WAREHOUSE=hdfs://namenode:8020/warehouse/fdb
      - FDB_ICEBERG_ENABLED=${FDB_ICEBERG_ENABLED:-true}
      - FDB_ICEBERG_WAREHOUSE=hdfs://namenode:8020/warehouse/iceberg
      - FDB_ICEBERG_CATALOG=fdb_iceberg
      - FDB_ICEBERG_DATABASE=${FDB_ICEBERG_DATABASE:-iceberg_db}
      - FDB_ICEBERG_TABLE=cell_kpi
      - FDB_ICEBERG_METASTORE_URI=${FDB_ICEBERG_METASTORE_URI:-thrift://hive-metastore:9083}
      - FDB_FLINK_CHECKPOINT_DIR=file:///tmp/fdb-checkpoints
      - FDB_FLINK_CHECKPOINT_INTERVAL_MS=${FDB_FLINK_CHECKPOINT_INTERVAL_MS:-30000}
      - FDB_FLINK_PARALLELISM=${FDB_FLINK_PARALLELISM:-4}
      - FDB_RESULT_SINK=${FDB_RESULT_SINK:-starrocks}
      - FDB_DLQ_ENABLED=${FDB_DLQ_ENABLED:-true}
      - FDB_METRICS_ENABLED=${FDB_METRICS_ENABLED:-true}
      - FDB_METRICS_HISTORY_ENABLED=${FDB_METRICS_HISTORY_ENABLED:-true}
      - FDB_METRICS_EMIT_INTERVAL_MS=${FDB_METRICS_EMIT_INTERVAL_MS:-5000}
      - FDB_RUN_ID=${FDB_RUN_ID:-}
      - FDB_RUN_LABEL=${FDB_RUN_LABEL:-}
      - FDB_E2E_SUMMARY=${FDB_E2E_SUMMARY:-0}
    volumes:
      - ../flink-job/target:/opt/fdb
      - ./lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:/opt/flink/lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:ro
    networks:
      - default
      - shared-data-infra

  taskmanager:
    image: flink:1.20.3-scala_2.12-java17
    container_name: fdb-flink-taskmanager
    profiles: ["e2e"]
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - "FLINK_PROPERTIES=taskmanager.memory.process.size: ${FDB_FLINK_TASKMANAGER_MEMORY:-4096m}\ntaskmanager.numberOfTaskSlots: ${FDB_FLINK_TASKMANAGER_SLOTS:-4}\ntaskmanager.memory.managed.fraction: ${FDB_FLINK_TASKMANAGER_MANAGED_FRACTION:-0.25}\nmetrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory\nmetrics.reporter.prom.port: 9249\nstate.checkpoints.num-retained: ${FDB_FLINK_RETAINED_CHECKPOINTS:-2}\nheartbeat.timeout: ${FDB_FLINK_HEARTBEAT_TIMEOUT_MS:-50000}\nheartbeat.interval: ${FDB_FLINK_HEARTBEAT_INTERVAL_MS:-10000}\npekko.ask.timeout: ${FDB_FLINK_PEKKO_ASK_TIMEOUT:-60s}"
      - FDB_KAFKA_BOOTSTRAP=${FDB_KAFKA_BOOTSTRAP:-kafka:9092}
      - FDB_KAFKA_FETCH_MAX_BYTES=${FDB_KAFKA_FETCH_MAX_BYTES:-}
      - FDB_KAFKA_MAX_PARTITION_FETCH_BYTES=${FDB_KAFKA_MAX_PARTITION_FETCH_BYTES:-}
      - FDB_KAFKA_MAX_POLL_RECORDS=${FDB_KAFKA_MAX_POLL_RECORDS:-}
      - FDB_STARROCKS_FE_ENDPOINT=${FDB_STARROCKS_FE_ENDPOINT:-starrocks-fe:9030}
      - FDB_STARROCKS_JDBC_URL=${FDB_STARROCKS_JDBC_URL:-jdbc:mysql://starrocks-fe:9030/fdb?rewriteBatchedStatements=true&useServerPrepStmts=false}
      - FDB_STARROCKS_CONNECTOR_JDBC_URL=${FDB_STARROCKS_CONNECTOR_JDBC_URL:-jdbc:mysql://starrocks-fe:9030}
      - FDB_STARROCKS_LOAD_URL=${FDB_STARROCKS_LOAD_URL:-starrocks-fe:8030}
      - FDB_STARROCKS_USER=${FDB_STARROCKS_USER:-root}
      - FDB_STARROCKS_PASSWORD=${FDB_STARROCKS_PASSWORD:-}
      - FDB_STARROCKS_DATABASE=${FDB_STARROCKS_DATABASE:-fdb}
      - FDB_STARROCKS_SINK_SEMANTIC=${FDB_STARROCKS_SINK_SEMANTIC:-exactly-once}
      - FDB_STARROCKS_SINK_LABEL_PREFIX=${FDB_STARROCKS_SINK_LABEL_PREFIX:-}
      - FDB_STARROCKS_SINK_BUFFER_FLUSH_MAX_BYTES=${FDB_STARROCKS_SINK_BUFFER_FLUSH_MAX_BYTES:-}
      - FDB_STARROCKS_SINK_BUFFER_FLUSH_MAX_ROWS=${FDB_STARROCKS_SINK_BUFFER_FLUSH_MAX_ROWS:-}
      - FDB_STARROCKS_SINK_BUFFER_FLUSH_INTERVAL_MS=${FDB_STARROCKS_SINK_BUFFER_FLUSH_INTERVAL_MS:-}
      - FDB_HIVE_WAREHOUSE=hdfs://namenode:8020/warehouse/fdb
      - FDB_ICEBERG_ENABLED=${FDB_ICEBERG_ENABLED:-true}
      - FDB_ICEBERG_WAREHOUSE=hdfs://namenode:8020/warehouse/iceberg
      - FDB_ICEBERG_CATALOG=fdb_iceberg
      - FDB_ICEBERG_DATABASE=${FDB_ICEBERG_DATABASE:-iceberg_db}
      - FDB_ICEBERG_TABLE=cell_kpi
      - FDB_ICEBERG_METASTORE_URI=${FDB_ICEBERG_METASTORE_URI:-thrift://hive-metastore:9083}
      - FDB_FLINK_CHECKPOINT_DIR=file:///tmp/fdb-checkpoints
      - FDB_FLINK_CHECKPOINT_INTERVAL_MS=${FDB_FLINK_CHECKPOINT_INTERVAL_MS:-30000}
      - FDB_FLINK_PARALLELISM=${FDB_FLINK_PARALLELISM:-4}
      - FDB_RESULT_SINK=${FDB_RESULT_SINK:-starrocks}
      - FDB_DLQ_ENABLED=${FDB_DLQ_ENABLED:-true}
      - FDB_METRICS_ENABLED=${FDB_METRICS_ENABLED:-true}
      - FDB_METRICS_HISTORY_ENABLED=${FDB_METRICS_HISTORY_ENABLED:-true}
      - FDB_METRICS_EMIT_INTERVAL_MS=${FDB_METRICS_EMIT_INTERVAL_MS:-5000}
      - FDB_RUN_ID=${FDB_RUN_ID:-}
      - FDB_RUN_LABEL=${FDB_RUN_LABEL:-}
      - FDB_E2E_SUMMARY=${FDB_E2E_SUMMARY:-0}
    volumes:
      - ./lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:/opt/flink/lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:ro
    networks:
      - default
      - shared-data-infra

networks:
  default:
    name: fdb
  shared-data-infra:
    external: true
    name: shared-data-infra
