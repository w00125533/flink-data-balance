name: fdb

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: fdb-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fdb-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: fdb-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  mysql:
    image: mysql:8.0
    container_name: fdb-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd
      MYSQL_DATABASE: fdb
      MYSQL_USER: fdb
      MYSQL_PASSWORD: fdbpwd
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4"]
    volumes:
      - ./data/mysql:/var/lib/mysql

  hms-postgres:
    image: postgres:14
    container_name: fdb-hms-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hivepwd
      POSTGRES_DB: metastore
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U hive -d metastore"]
      interval: 2s
      timeout: 5s
      retries: 15

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: fdb-hive-metastore
    depends_on:
      hms-postgres:
        condition: service_healthy
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hms-postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hivepwd
    volumes:
      - ./lib/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar
      - ./data/warehouse:/warehouse

  hive-server:
    image: apache/hive:4.0.0
    container_name: fdb-hive-server
    profiles: ["e2e"]
    depends_on:
      - hive-metastore
    ports:
      - "10000:10000"
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: -Dhive.metastore.uris=thrift://hive-metastore:9083
    volumes:
      - ./data/warehouse:/warehouse

  jobmanager:
    image: flink:1.20.3-scala_2.12-java17
    container_name: fdb-flink-jobmanager
    profiles: ["e2e"]
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - FDB_KAFKA_BOOTSTRAP=kafka:29092
      - FDB_MYSQL_URL=jdbc:mysql://mysql:3306/fdb
      - FDB_MYSQL_USER=fdb
      - FDB_MYSQL_PASSWORD=fdbpwd
      - FDB_HIVE_WAREHOUSE=file:///warehouse
      - FDB_FLINK_CHECKPOINT_DIR=file:///tmp/fdb-checkpoints
      - FDB_FLINK_CHECKPOINT_INTERVAL_MS=10000
      - FDB_E2E_SUMMARY=${FDB_E2E_SUMMARY:-0}
    volumes:
      - ./data/warehouse:/warehouse
      - ../flink-job/target:/opt/fdb

  taskmanager:
    image: flink:1.20.3-scala_2.12-java17
    container_name: fdb-flink-taskmanager
    profiles: ["e2e"]
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - FDB_KAFKA_BOOTSTRAP=kafka:29092
      - FDB_MYSQL_URL=jdbc:mysql://mysql:3306/fdb
      - FDB_MYSQL_USER=fdb
      - FDB_MYSQL_PASSWORD=fdbpwd
      - FDB_HIVE_WAREHOUSE=file:///warehouse
      - FDB_FLINK_CHECKPOINT_DIR=file:///tmp/fdb-checkpoints
      - FDB_FLINK_CHECKPOINT_INTERVAL_MS=10000
      - FDB_E2E_SUMMARY=${FDB_E2E_SUMMARY:-0}
    volumes:
      - ./data/warehouse:/warehouse
