name: fdb

services:
  mysql:
    image: mysql:8.0
    container_name: fdb-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd
      MYSQL_DATABASE: fdb
      MYSQL_USER: fdb
      MYSQL_PASSWORD: fdbpwd
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4"]
    volumes:
      - ./data/mysql:/var/lib/mysql

  observability-api:
    image: eclipse-temurin:17-jre
    container_name: fdb-observability-api
    working_dir: /app
    command: ["java", "-jar", "/app/observability-api.jar"]
    environment:
      FDB_OBSERVABILITY_PORT: "18080"
      FDB_KAFKA_BOOTSTRAP: kafka:9092
      FDB_METRICS_TOPIC: fdb-stage-metrics
      FDB_RUN_HISTORY_DIR: /observability-runs
    ports:
      - "18080:18080"
    volumes:
      - ../observability-api/target/observability-api-0.1.0-SNAPSHOT.jar:/app/observability-api.jar:ro
      - ./data/observability-runs:/observability-runs:ro
    networks:
      - default
      - shared-data-infra

  frontend:
    image: node:20-alpine
    container_name: fdb-observability-frontend
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev"]
    environment:
      VITE_API_PROXY_TARGET: "http://observability-api:18080"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
    depends_on:
      - observability-api

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: fdb-prometheus
    ports:
      - "${FDB_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - observability-api

  jobmanager:
    image: flink:1.20.3-scala_2.12-java17
    container_name: fdb-flink-jobmanager
    profiles: ["e2e"]
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - "FLINK_PROPERTIES=metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory\nmetrics.reporter.prom.port: 9249"
      - FDB_KAFKA_BOOTSTRAP=kafka:9092
      - FDB_MYSQL_URL=jdbc:mysql://mysql:3306/fdb
      - FDB_MYSQL_USER=fdb
      - FDB_MYSQL_PASSWORD=fdbpwd
      - FDB_HIVE_WAREHOUSE=hdfs://namenode:8020/warehouse/fdb
      - FDB_ICEBERG_ENABLED=${FDB_ICEBERG_ENABLED:-true}
      - FDB_ICEBERG_WAREHOUSE=hdfs://namenode:8020/warehouse/iceberg
      - FDB_ICEBERG_CATALOG=fdb_iceberg
      - FDB_ICEBERG_DATABASE=fdb
      - FDB_ICEBERG_TABLE=cell_kpi
      - FDB_FLINK_CHECKPOINT_DIR=file:///tmp/fdb-checkpoints
      - FDB_FLINK_CHECKPOINT_INTERVAL_MS=10000
      - FDB_E2E_SUMMARY=${FDB_E2E_SUMMARY:-0}
    volumes:
      - ../flink-job/target:/opt/fdb
      - ./lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:/opt/flink/lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:ro
    networks:
      - default
      - shared-data-infra

  taskmanager:
    image: flink:1.20.3-scala_2.12-java17
    container_name: fdb-flink-taskmanager
    profiles: ["e2e"]
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - "FLINK_PROPERTIES=metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory\nmetrics.reporter.prom.port: 9249"
      - FDB_KAFKA_BOOTSTRAP=kafka:9092
      - FDB_MYSQL_URL=jdbc:mysql://mysql:3306/fdb
      - FDB_MYSQL_USER=fdb
      - FDB_MYSQL_PASSWORD=fdbpwd
      - FDB_HIVE_WAREHOUSE=hdfs://namenode:8020/warehouse/fdb
      - FDB_ICEBERG_ENABLED=${FDB_ICEBERG_ENABLED:-true}
      - FDB_ICEBERG_WAREHOUSE=hdfs://namenode:8020/warehouse/iceberg
      - FDB_ICEBERG_CATALOG=fdb_iceberg
      - FDB_ICEBERG_DATABASE=fdb
      - FDB_ICEBERG_TABLE=cell_kpi
      - FDB_FLINK_CHECKPOINT_DIR=file:///tmp/fdb-checkpoints
      - FDB_FLINK_CHECKPOINT_INTERVAL_MS=10000
      - FDB_E2E_SUMMARY=${FDB_E2E_SUMMARY:-0}
    volumes:
      - ./lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:/opt/flink/lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:ro
    networks:
      - default
      - shared-data-infra

networks:
  default:
    name: fdb
  shared-data-infra:
    external: true
    name: shared-data-infra
